<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - La Mejor Zona Norte</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="login-container">
        <!-- SECCIÓN IZQUIERDA: Formulario -->
        <section class="login-form-section">
            <div class="form-wrapper">
                
                <img src="img/logo-azul.png" alt="Logo La Mejor Zona Norte" class="logo-form">
                
                <h1>Inicia sesión</h1>
                <p class="subtitle">Ingresa tu correo y contraseña para entrar a la aplicación</p>
                
                <!-- Añadido id="login-form" para controlar el evento -->
                <form id="login-form">
                    <!-- Campo de correo con id="login-email" -->
                    <input type="email" id="login-email" placeholder="correo electronico" required class="input-email">
                    
                    <!-- Campo de contraseña con id="login-password" -->
                    <input type="password" id="login-password" placeholder="contraseña" required class="input-password">
                    
                    <p id="login-error" role="alert" style="color:#d93025;font-size:14px;margin:8px 0;min-height:1em;"></p>
                    <button type="submit" class="btn-primary">Continuar</button>
                </form>
                
                <div class="divider">
                    <span>o</span>
                </div>
                
                <div class="social-login">
                    <button class="btn-secondary">
                        <img src="img/google-icon.png" alt="Google"> Continuar con Google
                    </button>
                </div>
                
                <p class="signup-link">
                    ¿No tienes cuenta? <a href="html/perfil.html">Registrate</a>
                </p>
                
                <p class="terms">
                    Al hacer clic en continuar, aceptas nuestros 
                    <a href="#">Términos de servicio</a> y <a href="#">Política de privacidad</a>
                </p>
            </div>
        </section>

        <!-- SECCIÓN DERECHA: Panel Azul (Se mantiene igual para PC) -->
        <section class="login-branding-section">
            <div class="branding-content">
                <img src="img/logo-blanco.png" alt="Logo Blanco" class="logo-branding">
                <h2>Lo mejor del Béisbol de la Zona norte lo encuentras aquí</h2>
            </div>
        </section>
    </main>

    <script>
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            loginError.textContent = '';

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            try {
                const resp = await fetch('/api/usuarios/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await resp.json();

                if (!resp.ok) {
                    loginError.textContent = data.error || 'No se pudo iniciar sesión';
                    return;
                }

                // Guardamos los datos del usuario obtenidos de la base de datos
                const u = data.usuario;
                localStorage.setItem('userId', u.id);
                localStorage.setItem('userName', u.nombre);
                localStorage.setItem('userEmail', u.email);
                localStorage.setItem('userPhone', u.telefono || '');
                localStorage.setItem('userDob', u.fecha_nacimiento || '');
                if (u.avatar) localStorage.setItem('userAvatar', u.avatar);
                else localStorage.removeItem('userAvatar');

                window.location.href = 'html/principal.html';
            } catch (err) {
                loginError.textContent = 'No se pudo conectar con el servidor';
            }
        });
    </script>
</body>
</html>
