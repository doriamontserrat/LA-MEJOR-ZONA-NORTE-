<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Prueba Camera + Three.js</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
        }
        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            z-index: -1;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: lime;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            z-index: 100;
            border-radius: 5px;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        button {
            padding: 10px 20px;
            background: #0099ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #0077cc;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
    
    <div id="info">
        <div>Estado: <span id="status">Cargando...</span></div>
        <div>Cámara: <span id="camera-type">---</span></div>
        <div>Video: <span id="video-status">---</span></div>
        <div>FPS: <span id="fps">0</span></div>
    </div>

    <div id="controls">
        <button onclick="initCamera()">Iniciar Cámara</button>
        <button onclick="switchCamera()">Cambiar Cámara</button>
        <button onclick="loadModel()">Cargar Modelo 3D</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@r128/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // === CONFIGURACIÓN ===
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('webgl2', { antialias: true, alpha: true });
        
        let scene, camera, renderer, model;
        let facingMode = 'environment';
        let frameCount = 0;
        let lastFpsTime = Date.now();

        // === INICIALIZAR CANVAS ===
        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.z = 5;
            
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            
            // Iluminación
            const light1 = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.2);
            scene.add(light1);
            
            const light2 = new THREE.DirectionalLight(0xffffff, 0.8);
            light2.position.set(5, 5, 5);
            scene.add(light2);

            // Cubo por defecto
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshPhongMaterial({ color: 0x0088ff });
            model = new THREE.Mesh(geometry, material);
            model.rotation.x = 0.4;
            model.rotation.y = 0.4;
            scene.add(model);

            setStatus('Canvas inicializado ✓', '#00ff00');
            startRenderLoop();
        }

        // === LOOP DE RENDERIZADO ===
        function startRenderLoop() {
            const animate = () => {
                requestAnimationFrame(animate);
                
                // Rotar el modelo
                if (model) {
                    model.rotation.x += 0.005;
                    model.rotation.y += 0.008;
                }
                
                renderer.render(scene, camera);
                
                // Calcular FPS
                frameCount++;
                const now = Date.now();
                if (now - lastFpsTime >= 1000) {
                    document.getElementById('fps').textContent = frameCount;
                    frameCount = 0;
                    lastFpsTime = now;
                }
            };
            animate();
        }

        // === INICIALIZAR CÁMARA ===
        async function initCamera() {
            setStatus('Solicitando cámara...', '#ffaa00');
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });

                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    document.getElementById('camera-type').textContent = facingMode;
                    document.getElementById('video-status').textContent = `${video.videoWidth}x${video.videoHeight}`;
                    setStatus('Cámara activa ✓', '#00ff00');
                };

            } catch (error) {
                console.error('Error:', error);
                setStatus('Error: ' + error.message, '#ff4444');
            }
        }

        // === CAMBIAR CÁMARA ===
        async function switchCamera() {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            
            setTimeout(() => initCamera(), 500);
        }

        // === CARGAR MODELO 3D ===
        async function loadModel() {
            setStatus('Cargando modelo 3D...', '#ffaa00');
            
            try {
                const loader = new THREE.GLTFLoader();
                const gltf = await loader.loadAsync('../Modelos/acereros.glb');
                
                scene.remove(model);
                model = gltf.scene;
                model.scale.set(0.5, 0.5, 0.5);
                model.position.set(0, 0, 0);
                scene.add(model);
                
                setStatus('Modelo cargado ✓', '#00ff00');
            } catch (error) {
                console.error('Error cargando modelo:', error);
                setStatus('Error: ' + error.message, '#ff4444');
            }
        }

        // === UTILIDADES ===
        function setStatus(message, color) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.style.color = color;
        }

        // === INICIALIZAR ===
        window.addEventListener('load', () => {
            initCanvas();
            setStatus('Presiona "Iniciar Cámara"', '#ffaa00');
        });

        // Ajustar canvas al redimensionar
        window.addEventListener('resize', () => {
            if (renderer && camera) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
